<?xml version="1.0" encoding="UTF-8"?>
<!--
  Email Signal extension icon — the "Ambient Pulse" miniaturized.
  A single glowing cobalt dot with one soft ring, centered on a dark
  rounded-square tile. No envelope, no @, no letter-mark, one accent only.

  Reference master is 64x64. All values are proportional to that grid:
    tile bg        #0a0e1a
    corner radius  14  (~22%)
    dot diameter   14  (~22%, r=7) color #4d9eff
    glow blur      ~3.8 (~6%) color rgba(77,158,255,0.20)
    ring color     #7ab6ff @ 60% opacity
    ring stroke    1.5
    ring diameter  ~33 (~52%, r=16.6)
  Center of dot + ring: (32, 32).
-->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.8"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#0a0e1a"/>

  <!-- Soft glow halo behind the dot (accent-soft) -->
  <circle cx="32" cy="32" r="7" fill="rgba(77,158,255,0.20)" filter="url(#glow)"/>

  <!-- One soft ring (accent-strong @ 60%) -->
  <circle cx="32" cy="32" r="16.6" fill="none" stroke="#7ab6ff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Glowing accent dot (flat accent, glow does the work) -->
  <circle cx="32" cy="32" r="7" fill="#4d9eff"/>
</svg>
