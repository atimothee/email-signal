<?xml version="1.0" encoding="UTF-8"?>
<!--
  16x16-specific variant of icon.svg. At 16px the master's 1.5px ring scales
  to <0.4px and muddies, so the ring is thickened (1px at this 16-grid) and
  pulled slightly outward for clear separation from the dot. The dot + glow
  read identically to the master. Master source of truth is icon.svg.
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.0"/>
    </filter>
  </defs>

  <!-- Tile (corner radius ~22% = 3.5) -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" ry="3.5" fill="#0a0e1a"/>

  <!-- Soft glow halo (accent-soft), dot r ~1.75 (~22%) -->
  <circle cx="8" cy="8" r="1.75" fill="rgba(77,158,255,0.20)" filter="url(#glow)"/>

  <!-- One soft ring, thickened to 1px and r=4.4 so it reads at 16px -->
  <circle cx="8" cy="8" r="4.4" fill="none" stroke="#7ab6ff" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Glowing accent dot -->
  <circle cx="8" cy="8" r="1.75" fill="#4d9eff"/>
</svg>
